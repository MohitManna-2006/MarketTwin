[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markettwin-api"
version = "0.4.0"
description = "Local research API for the MarketTwin simulation core"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "markettwin",
  "pydantic>=2.9",
  "uvicorn>=0.32",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.uv.sources]
markettwin = { path = "../../python" }

[tool.hatch.build.targets.wheel]
packages = ["markettwin_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PTH", "N"]

[tool.ruff.lint.per-file-ignores]
# One field per line, with its unit, range, and meaning, reads better unwrapped.
"markettwin_api/config_models.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["markettwin_api"]

[[tool.mypy.overrides]]
module = ["markettwin._native"]
ignore_missing_imports = true
